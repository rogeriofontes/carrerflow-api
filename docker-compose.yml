services:
  postgres:
    image: postgres:16-alpine
    container_name: careerflow-db
    environment:
      POSTGRES_DB: careerflow-db
      POSTGRES_USER: careerflow
      POSTGRES_PASSWORD: careerflow@123
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerflow"]
      interval: 10s
      timeout: 5s
      retries: 5

