spring:
  datasource:
    url: jdbc:h2:mem:careerflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false

careerflow:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLTEyMzQ1Njc4OTAxMjM0NTY=
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  openai:
    api-key: test-api-key
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1
    timeout-ms: 5000
    max-retries: 1

logging:
  level:
    com.careerflow: DEBUG
